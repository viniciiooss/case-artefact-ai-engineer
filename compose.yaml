services:
  emporio:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      EMPORIO_DATA_DIR: /app/data
      EMPORIO_STATE_DIR: /app/var
    volumes:
      - emporio-state:/app/var
    init: true
    restart: unless-stopped

volumes:
  emporio-state:
